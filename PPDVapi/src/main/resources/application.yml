server:
  port: 8080

spring:
  application:
    name: ppdvapi
  # 关系库：MySQL（业务 + 若依 RBAC），表结构由 Flyway 管理
  datasource:
    url: jdbc:mysql://localhost:13306/ppdv?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ppdv
    password: ppdv123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none          # 表结构交给 Flyway
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 登录令牌 / 验证码 / 在线用户
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password:
      timeout: 3s

# ---- PPDV 自定义配置 ----
ppdv:
  # JWT 鉴权
  jwt:
    header: Authorization
    secret: ppdv-super-secret-key-please-change-in-prod-0123456789abcdef
    expire-minutes: 720        # 令牌有效期（分钟），12h
  # 登录验证码（首登可先关，链路打通后置 true；开启需 Redis）
  captcha:
    enabled: false
  # 车云通信（MQTT / EMQX）。接入 EMQX 后置 true。
  mqtt:
    enabled: true
    url: tcp://localhost:1883
    username: ppdv-backend
    password: ppdv-backend-secret
    client-id-prefix: ppdv-api
  # 遥测时序库（TDengine，REST 连接，免原生客户端）。
  tdengine:
    enabled: true
    url: jdbc:TAOS-RS://localhost:6041
    username: root
    password: taosdata
    database: ppdv_tsdb

logging:
  level:
    com.ppdv: INFO
    org.springframework.integration.mqtt: INFO
