server:
  port: 8080

spring:
  application:
    name: ppdvapi
  datasource:
    url: jdbc:h2:mem:ppdv;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 车云通信（MQTT）配置。默认关闭，无 broker 也能启动。
# 部署好 MQTT broker 后置为 true，并填写地址与凭据。
ppdv:
  mqtt:
    enabled: false
    url: tcp://localhost:1883
    username:
    password:
    client-id-prefix: ppdv-api

logging:
  level:
    com.ppdv: INFO
    org.springframework.integration.mqtt: INFO
